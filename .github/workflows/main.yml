              private fun loadLogo(url: String, iv: ImageView, letter: TextView?) {
                  iv.setImageDrawable(null)
                  iv.tag = url
                  letter?.visibility = View.VISIBLE
                  if (url.isBlank() || failed.contains(url)) return
                  val cached = logos.get(url)
                  if (cached != null) {
                      iv.setImageBitmap(cached)
                      letter?.visibility = View.GONE
                      return
                  }
                  pool.execute {
                      try {
                          val c = URL(url).openConnection() as HttpURLConnection
                          c.connectTimeout = 8000
                          c.readTimeout = 8000
                          val bmp = c.inputStream.use { BitmapFactory.decodeStream(it) } ?: throw Exception("bad image")
                          val ratio = 120f / maxOf(bmp.width, bmp.height)
                          val scaled = if (ratio < 1f) {
                              Bitmap.createScaledBitmap(
                                  bmp,
                                  (bmp.width * ratio).toInt().coerceAtLeast(1),
                                  (bmp.height * ratio).toInt().coerceAtLeast(1),
                                  true
                              )
                          } else bmp
                          runOnUiThread {
                              logos.put(url, scaled)
                              if (iv.tag == url) {
                                  iv.setImageBitmap(scaled)
                                  letter?.visibility = View.GONE
                              }
                          }
                      } catch (e: Exception) {
                          runOnUiThread { failed.add(url) }
                      }
                  }
              }

