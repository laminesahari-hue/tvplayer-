              private fun initPlayer() {
                  val http = DefaultHttpDataSource.Factory()
                      .setAllowCrossProtocolRedirects(true)
                      .setConnectTimeoutMs(10000)
                      .setReadTimeoutMs(15000)
                      .setUserAgent("Mozilla/5.0 (Linux; Android) TVPlayer/5.0")
                  val lc = DefaultLoadControl.Builder()
                      .setBufferDurationsMs(15000, 50000, 1500, 3000)
                      .build()
                  val exo = ExoPlayer.Builder(this)
                      .setMediaSourceFactory(DefaultMediaSourceFactory(this).setDataSourceFactory(http))
                      .setLoadControl(lc)
                      .setAudioAttributes(AudioAttributes.DEFAULT, true)
                      .setHandleAudioBecomingNoisy(true)
                      .build()
                  player = exo
                  playerView.player = exo
                  playerView.setResizeMode(resizeModes[resizeIndex])
                  exo.addListener(object : Player.Listener {
                      override fun onPlaybackStateChanged(playbackState: Int) {
                          if (playbackState == Player.STATE_READY) retries = 0
                      }

                      override fun onIsPlayingChanged(isPlaying: Boolean) {
                          playBtn.text = if (isPlaying) {
                              tr("❚❚ Pause", "❚❚ Pause", "❚❚ إيقاف", "❚❚ Pausa")
                          } else {
                              tr("▶ Lecture", "▶ Play", "▶ تشغيل", "▶ Reproducir")
                          }
                      }

                      override fun onPlayerError(error: PlaybackException) {
                          val p = player ?: return
                          if (error.errorCode == PlaybackException.ERROR_CODE_BEHIND_LIVE_WINDOW) {
                              p.seekToDefaultPosition()
                              p.prepare()
                              return
                          }
                          if (retries < 5) {
                              retries++
                              showOverlay(
                                  tr("Reconnexion…", "Reconnecting…", "إعادة الاتصال…", "Reconectando…") +
                                      " (" + retries + "/5)"
                              )
                              ui.postDelayed({ player?.prepare() }, 2000L * retries)
                          } else {
                              showOverlay(
                                  tr("⚠ Chaîne indisponible", "⚠ Channel unavailable", "⚠ القناة غير متاحة", "⚠ Canal no disponible")
                              )
                          }
                      }
                  })
              }

