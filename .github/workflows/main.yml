name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Prepare web files
        run: |
          echo "=== Fichiers du depot ==="
          find . -path ./.git -prune -o -type f -print | head -100
          mkdir -p www
          IDX=$(find . -name index.html -not -path "./www/*" -not -path "./.git/*" -not -path "*/node_modules/*" | head -1)
          if [ -n "$IDX" ]; then
            DIR=$(dirname "$IDX")
            echo "index.html trouve dans $DIR"
            rsync -a --exclude='.git' --exclude='.github' --exclude='www' "$DIR"/ www/
          else
            HTML=$(find . -name "*.html" -not -path "./www/*" -not -path "./.git/*" | head -1)
            if [ -z "$HTML" ]; then
              echo "ERREUR: aucun fichier .html dans le depot"
              exit 1
            fi
            echo "Utilisation de $HTML comme index.html"
            DIR=$(dirname "$HTML")
            rsync -a --exclude='.git' --exclude='.github' --exclude='www' "$DIR"/ www/
            cp "$HTML" www/index.html
          fi
          ls www

      - name: Create Android project
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "TV Player" com.lamine.tvplayer --web-dir=www
          npx cap add android
          npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tvplayer-apk
          path: android/app/build/outputs/apk/debug/*.apk
