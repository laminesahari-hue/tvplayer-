name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Create project files
        run: |
          mkdir -p app/src/main/java/com/example/tvplayer
          mkdir -p app/src/main/res/drawable

          cat > settings.gradle.kts << 'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "tvplayer"
          include(":app")
          EOF

          cat > build.gradle.kts << 'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF

          cat > gradle.properties << 'EOF'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2g
          EOF

          cat > app/build.gradle.kts << 'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.example.tvplayer"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.example.tvplayer"
                  minSdk = 21
                  targetSdk = 34
                  versionCode = 3
                  versionName = "3.0"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              implementation("androidx.media3:media3-exoplayer:1.3.1")
              implementation("androidx.media3:media3-exoplayer-hls:1.3.1")
              implementation("androidx.media3:media3-exoplayer-dash:1.3.1")
              implementation("androidx.media3:media3-ui:1.3.1")
          }
          EOF

          cat > app/src/main/res/drawable/ic_launcher.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#4F8CFF"
                  android:pathData="M0,0h108v108h-108z" />
              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M40,30L80,54L40,78Z" />
          </vector>
          EOF

          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-feature android:name="android.software.leanback" android:required="false" />
              <uses-feature android:name="android.hardware.touchscreen" android:required="false" />
              <application
                  android:label="TV Player"
                  android:icon="@drawable/ic_launcher"
                  android:usesCleartextTraffic="true"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:supportsPictureInPicture="true"
                      android:resizeableActivity="true"
                      android:configChanges="orientation|screenSize|keyboardHidden|keyboard|navigation|smallestScreenSize|screenLayout|uiMode">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                          <category android:name="android.intent.category.LEANBACK_LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/example/tvplayer/Channel.kt << 'EOF'
          package com.example.tvplayer

          data class Channel(
              var name: String,
              val url: String,
              val group: String = "",
              val logo: String = "",
              var fav: Boolean = false
          )

          val defaultChannels = listOf(
              Channel("Test - Big Buck Bunny", "https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8", "Test"),
              Channel("Test - Apple BipBop", "https://devstreaming-cdn.apple.com/videos/streaming/examples/img_bipbop_adv_example_fmp4/master.m3u8", "Test")
          )

          private val attrRegex = Regex("([a-zA-Z0-9-]+)=\"([^\"]*)\"")

          fun parseM3u(text: String): List<Channel> {
              val out = mutableListOf<Channel>()
              var name = ""
              var group = ""
              var logo = ""
              for (raw in text.lines()) {
                  val line = raw.trim()
                  if (line.startsWith("#EXTINF")) {
                      name = line.substringAfterLast(",", "").trim()
                      group = ""
                      logo = ""
                      for (m in attrRegex.findAll(line)) {
                          when (m.groupValues[1].lowercase()) {
                              "group-title" -> group = m.groupValues[2]
                              "tvg-logo" -> logo = m.groupValues[2]
                              "tvg-name" -> if (name.isEmpty()) name = m.groupValues[2]
                          }
                      }
                  } else if (line.startsWith("#EXTGRP:")) {
                      if (group.isEmpty()) group = line.substringAfter(":").trim()
                  } else if (line.isNotEmpty() && !line.startsWith("#")) {
                      val url = line.substringBefore("|")
                      out.add(Channel(if (name.isEmpty()) url else name, url, group, logo, false))
                      name = ""
                      group = ""
                      logo = ""
                  }
              }
              return out
          }
          EOF

          cat > app/src/main/java/com/example/tvplayer/MainActivity.kt << 'EOF'
          package com.example.tvplayer

          import android.app.Activity
          import android.app.AlertDialog
          import android.app.PictureInPictureParams
          import android.content.ClipData
          import android.content.ClipboardManager
          import android.content.Context
          import android.content.Intent
          import android.content.SharedPreferences
          import android.content.pm.ActivityInfo
          import android.content.res.Configuration
          import android.graphics.Bitmap
          import android.graphics.BitmapFactory
          import android.graphics.Color
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.os.Build
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.text.Editable
          import android.text.TextUtils
          import android.text.TextWatcher
          import android.util.LruCache
          import android.util.Rational
          import android.view.Gravity
          import android.view.KeyEvent
          import android.view.View
          import android.view.ViewGroup
          import android.view.WindowManager
          import android.widget.BaseAdapter
          import android.widget.EditText
          import android.widget.FrameLayout
          import android.widget.HorizontalScrollView
          import android.widget.ImageView
          import android.widget.LinearLayout
          import android.widget.ListView
          import android.widget.TextView
          import android.widget.Toast
          import androidx.media3.common.MediaItem
          import androidx.media3.common.PlaybackException
          import androidx.media3.common.Player
          import androidx.media3.datasource.DefaultHttpDataSource
          import androidx.media3.exoplayer.ExoPlayer
          import androidx.media3.exoplayer.source.DefaultMediaSourceFactory
          import androidx.media3.ui.AspectRatioFrameLayout
          import androidx.media3.ui.PlayerView
          import java.net.HttpURLConnection
          import java.net.URL
          import java.util.concurrent.Executors
          import org.json.JSONArray
          import org.json.JSONObject

          class MainActivity : Activity() {

              private val BG = Color.parseColor("#0F1115")
              private val CARD = Color.parseColor("#1A1D24")
              private val ACCENT = Color.parseColor("#4F8CFF")
              private val SUB = Color.parseColor("#9AA0AA")

              private var player: ExoPlayer? = null
              private lateinit var prefs: SharedPreferences
              private lateinit var playerFrame: FrameLayout
              private lateinit var playerView: PlayerView
              private lateinit var overlay: TextView
              private lateinit var header: LinearLayout
              private lateinit var countText: TextView
              private lateinit var toolbarScroll: HorizontalScrollView
              private lateinit var chipsScroll: HorizontalScrollView
              private lateinit var chips: LinearLayout
              private lateinit var search: EditText
              private lateinit var listFrame: FrameLayout
              private lateinit var list: ListView
              private lateinit var emptyText: TextView
              private lateinit var adapter: ChannelAdapter

              private var all = mutableListOf<Channel>()
              private var shown = listOf<Channel>()
              private var filter = ""
              private var currentUrl = ""
              private var fullscreen = false
              private var inPip = false
              private var resizeIndex = 0

              private val ui = Handler(Looper.getMainLooper())
              private val pool = Executors.newFixedThreadPool(3)
              private val logos = LruCache<String, Bitmap>(80)
              private val failed = HashSet<String>()

              private val sleepRunnable = Runnable {
                  player?.pause()
                  toast("Minuteur : lecture arrêtée")
              }
              private val hideOverlay = Runnable { overlay.visibility = View.GONE }

              private class Holder(
                  val outer: FrameLayout,
                  val letter: TextView,
                  val logo: ImageView,
                  val name: TextView,
                  val group: TextView,
                  val star: TextView
              )

              // ---------- utilitaires ----------

              private fun dp(v: Int) = (v * resources.displayMetrics.density).toInt()

              private fun toast(s: String) = Toast.makeText(this, s, Toast.LENGTH_SHORT).show()

              private fun rounded(color: Int, r: Int): GradientDrawable {
                  val g = GradientDrawable()
                  g.setColor(color)
                  g.cornerRadius = dp(r).toFloat()
                  return g
              }

              private fun dialog() = AlertDialog.Builder(this, AlertDialog.THEME_DEVICE_DEFAULT_DARK)

              private fun field(hint: String, value: String = ""): EditText {
                  val e = EditText(this)
                  e.hint = hint
                  e.setText(value)
                  e.isSingleLine = true
                  return e
              }

              private fun form(vararg views: View): LinearLayout {
                  val box = LinearLayout(this)
                  box.orientation = LinearLayout.VERTICAL
                  box.setPadding(dp(20), dp(8), dp(20), 0)
                  for (v in views) box.addView(v)
                  return box
              }

              private fun pill(label: String, selected: Boolean): TextView {
                  val t = TextView(this)
                  t.text = label
                  t.textSize = 14f
                  t.setTextColor(Color.WHITE)
                  t.gravity = Gravity.CENTER
                  t.setPadding(dp(14), 0, dp(14), 0)
                  t.isClickable = true
                  t.isFocusable = true
                  t.background = rounded(if (selected) ACCENT else CARD, 20)
                  t.setOnFocusChangeListener { v, has ->
                      v.background = rounded(if (has || selected) ACCENT else CARD, 20)
                  }
                  return t
              }

              // ---------- creation ----------

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  window.addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)
                  window.statusBarColor = BG
                  window.navigationBarColor = BG
                  prefs = getSharedPreferences("tvplayer", MODE_PRIVATE)
                  load()
                  currentUrl = prefs.getString("last", "") ?: ""

                  val root = LinearLayout(this)
                  root.orientation = LinearLayout.VERTICAL
                  root.setBackgroundColor(BG)

                  // lecteur
                  playerFrame = FrameLayout(this)
                  playerFrame.setBackgroundColor(Color.BLACK)
                  playerView = PlayerView(this)
                  playerView.setShowBuffering(PlayerView.SHOW_BUFFERING_WHEN_PLAYING)
                  playerFrame.addView(playerView, FrameLayout.LayoutParams(-1, -1))

                  overlay = TextView(this)
                  overlay.setTextColor(Color.WHITE)
                  overlay.textSize = 14f
                  overlay.setPadding(dp(12), dp(6), dp(12), dp(6))
                  overlay.background = rounded(Color.parseColor("#99000000"), 8)
                  overlay.visibility = View.GONE
                  val olp = FrameLayout.LayoutParams(-2, -2)
                  olp.gravity = Gravity.TOP or Gravity.START
                  olp.setMargins(dp(10), dp(10), dp(10), 0)
                  playerFrame.addView(overlay, olp)
                  root.addView(playerFrame, LinearLayout.LayoutParams(-1, dp(220)))

                  // en-tete
                  header = LinearLayout(this)
                  header.orientation = LinearLayout.HORIZONTAL
                  header.gravity = Gravity.CENTER_VERTICAL
                  header.setPadding(dp(16), dp(12), dp(16), dp(4))
                  val title = TextView(this)
                  title.text = "TV Player"
                  title.textSize = 20f
                  title.typeface = Typeface.DEFAULT_BOLD
                  title.setTextColor(Color.WHITE)
                  header.addView(title, LinearLayout.LayoutParams(0, -2, 1f))
                  countText = TextView(this)
                  countText.setTextColor(SUB)
                  countText.textSize = 13f
                  header.addView(countText)
                  root.addView(header, LinearLayout.LayoutParams(-1, -2))

                  // barre de boutons
                  toolbarScroll = HorizontalScrollView(this)
                  toolbarScroll.isHorizontalScrollBarEnabled = false
                  val bar = LinearLayout(this)
                  bar.orientation = LinearLayout.HORIZONTAL
                  bar.setPadding(dp(12), dp(6), dp(12), dp(6))
                  fun addBtn(label: String, action: () -> Unit) {
                      val b = pill(label, false)
                      b.setOnClickListener { action() }
                      val lp = LinearLayout.LayoutParams(-2, dp(40))
                      lp.setMargins(dp(4), 0, dp(4), 0)
                      bar.addView(b, lp)
                  }
                  addBtn("◀ Préc.") { step(-1) }
                  addBtn("Suiv. ▶") { step(1) }
                  addBtn("⛶ Plein écran") { setFullscreen(true) }
                  addBtn("Format") { cycleResize() }
                  addBtn("Veille") { sleepDialog() }
                  addBtn("PiP") { enterPip() }
                  addBtn("⋮ Plus") { menuDialog() }
                  toolbarScroll.addView(bar)
                  root.addView(toolbarScroll, LinearLayout.LayoutParams(-1, -2))

                  // groupes
                  chipsScroll = HorizontalScrollView(this)
                  chipsScroll.isHorizontalScrollBarEnabled = false
                  chips = LinearLayout(this)
                  chips.orientation = LinearLayout.HORIZONTAL
                  chips.setPadding(dp(12), dp(2), dp(12), dp(6))
                  chipsScroll.addView(chips)
                  root.addView(chipsScroll, LinearLayout.LayoutParams(-1, -2))

                  // recherche
                  search = EditText(this)
                  search.hint = "Rechercher une chaîne"
                  search.setTextColor(Color.WHITE)
                  search.setHintTextColor(SUB)
                  search.isSingleLine = true
                  search.setPadding(dp(16), dp(10), dp(16), dp(10))
                  search.background = rounded(CARD, 12)
                  val slp = LinearLayout.LayoutParams(-1, -2)
                  slp.setMargins(dp(16), dp(4), dp(16), dp(8))
                  root.addView(search, slp)

                  // liste
                  listFrame = FrameLayout(this)
                  list = ListView(this)
                  list.divider = null
                  list.dividerHeight = 0
                  list.clipToPadding = false
                  list.setPadding(dp(12), 0, dp(12), dp(12))
                  list.selector = rounded(Color.parseColor("#334F8CFF"), 12)
                  list.setDrawSelectorOnTop(true)
                  listFrame.addView(list, FrameLayout.LayoutParams(-1, -1))
                  emptyText = TextView(this)
                  emptyText.text = "Aucune chaîne\n\nTouchez « ⋮ Plus » pour ajouter une chaîne ou importer une playlist"
                  emptyText.setTextColor(SUB)
                  emptyText.gravity = Gravity.CENTER
                  emptyText.setPadding(dp(32), dp(32), dp(32), dp(32))
                  listFrame.addView(emptyText, FrameLayout.LayoutParams(-1, -1))
                  list.emptyView = emptyText
                  root.addView(listFrame, LinearLayout.LayoutParams(-1, 0, 1f))

                  setContentView(root)

                  // moteur video
                  val http = DefaultHttpDataSource.Factory()
                      .setAllowCrossProtocolRedirects(true)
                      .setUserAgent("Mozilla/5.0 (Linux; Android) TVPlayer/3.0")
                  val exo = ExoPlayer.Builder(this)
                      .setMediaSourceFactory(DefaultMediaSourceFactory(this).setDataSourceFactory(http))
                      .build()
                  player = exo
                  playerView.player = exo
                  exo.addListener(object : Player.Listener {
                      override fun onPlayerError(error: PlaybackException) {
                          showOverlay("⚠ Chaîne indisponible")
                          toast("Chaîne indisponible (" + error.errorCodeName + ")")
                      }
                  })

                  adapter = ChannelAdapter()
                  list.adapter = adapter
                  list.setOnItemClickListener { _, _, position, _ ->
                      if (position in shown.indices) play(shown[position])
                  }
                  list.setOnItemLongClickListener { _, _, position, _ ->
                      if (position in shown.indices) channelMenu(shown[position])
                      true
                  }

                  search.addTextChangedListener(object : TextWatcher {
                      override fun beforeTextChanged(s: CharSequence?, st: Int, c: Int, a: Int) {}
                      override fun onTextChanged(s: CharSequence?, st: Int, b: Int, c: Int) {}
                      override fun afterTextChanged(s: Editable?) { refresh(false) }
                  })

                  applyPlayerSize()
                  refresh(true)
              }

              // ---------- adaptateur ----------

              inner class ChannelAdapter : BaseAdapter() {
                  override fun getCount() = shown.size
                  override fun getItem(position: Int): Any = shown[position]
                  override fun getItemId(position: Int) = position.toLong()

                  override fun getView(position: Int, convertView: View?, parent: ViewGroup?): View {
                      val ch = shown[position]
                      val h: Holder
                      val v: View
                      if (convertView == null) {
                          h = newRow()
                          v = h.outer
                          v.tag = h
                      } else {
                          v = convertView
                          h = v.tag as Holder
                      }
                      h.name.text = ch.name
                      h.name.setTextColor(if (ch.url == currentUrl) ACCENT else Color.WHITE)
                      h.group.text = ch.group
                      h.group.visibility = if (ch.group.isBlank()) View.GONE else View.VISIBLE
                      h.letter.text = ch.name.trim().take(1).uppercase()
                      h.star.text = if (ch.fav) "★" else "☆"
                      h.star.setTextColor(if (ch.fav) Color.parseColor("#FFC107") else SUB)
                      h.star.setOnClickListener {
                          ch.fav = !ch.fav
                          save()
                          refresh(true)
                      }
                      loadLogo(ch.logo, h)
                      return v
                  }
              }

              private fun newRow(): Holder {
                  val outer = FrameLayout(this)
                  outer.setPadding(0, dp(4), 0, dp(4))

                  val card = LinearLayout(this)
                  card.orientation = LinearLayout.HORIZONTAL
                  card.gravity = Gravity.CENTER_VERTICAL
                  card.setPadding(dp(10), dp(10), dp(6), dp(10))
                  card.background = rounded(CARD, 12)

                  val logoBox = FrameLayout(this)
                  logoBox.background = rounded(Color.parseColor("#262A33"), 10)
                  val letter = TextView(this)
                  letter.gravity = Gravity.CENTER
                  letter.textSize = 18f
                  letter.typeface = Typeface.DEFAULT_BOLD
                  letter.setTextColor(ACCENT)
                  logoBox.addView(letter, FrameLayout.LayoutParams(-1, -1))
                  val logo = ImageView(this)
                  logo.scaleType = ImageView.ScaleType.FIT_CENTER
                  logo.setPadding(dp(4), dp(4), dp(4), dp(4))
                  logoBox.addView(logo, FrameLayout.LayoutParams(-1, -1))
                  card.addView(logoBox, LinearLayout.LayoutParams(dp(48), dp(48)))

                  val texts = LinearLayout(this)
                  texts.orientation = LinearLayout.VERTICAL
                  texts.setPadding(dp(12), 0, dp(8), 0)
                  val name = TextView(this)
                  name.textSize = 16f
                  name.isSingleLine = true
                  name.ellipsize = TextUtils.TruncateAt.END
                  val group = TextView(this)
                  group.textSize = 12f
                  group.setTextColor(SUB)
                  group.isSingleLine = true
                  group.ellipsize = TextUtils.TruncateAt.END
                  texts.addView(name)
                  texts.addView(group)
                  card.addView(texts, LinearLayout.LayoutParams(0, -2, 1f))

                  val star = TextView(this)
                  star.textSize = 22f
                  star.setPadding(dp(10), dp(6), dp(10), dp(6))
                  star.isFocusable = false
                  star.isClickable = true
                  card.addView(star, LinearLayout.LayoutParams(-2, -2))

                  outer.addView(card, FrameLayout.LayoutParams(-1, -2))
                  return Holder(outer, letter, logo, name, group, star)
              }

              private fun loadLogo(url: String, h: Holder) {
                  h.logo.setImageDrawable(null)
                  h.logo.tag = url
                  if (url.isBlank() || failed.contains(url)) return
                  val cached = logos.get(url)
                  if (cached != null) {
                      h.logo.setImageBitmap(cached)
                      return
                  }
                  pool.execute {
                      try {
                          val c = URL(url).openConnection() as HttpURLConnection
                          c.connectTimeout = 8000
                          c.readTimeout = 8000
                          val bmp = c.inputStream.use { BitmapFactory.decodeStream(it) }
                          if (bmp == null) throw Exception("bad image")
                          val ratio = 96f / maxOf(bmp.width, bmp.height)
                          val scaled = if (ratio < 1f) {
                              Bitmap.createScaledBitmap(
                                  bmp,
                                  (bmp.width * ratio).toInt().coerceAtLeast(1),
                                  (bmp.height * ratio).toInt().coerceAtLeast(1),
                                  true
                              )
                          } else bmp
                          runOnUiThread {
                              logos.put(url, scaled)
                              if (h.logo.tag == url) h.logo.setImageBitmap(scaled)
                          }
                      } catch (e: Exception) {
                          runOnUiThread { failed.add(url) }
                      }
                  }
              }

              // ---------- donnees ----------

              private fun load() {
                  val s = prefs.getString("channels_v3", null)
                  all = if (s == null) {
                      defaultChannels.map { it.copy() }.toMutableList()
                  } else {
                      try {
                          val arr = JSONArray(s)
                          val out = mutableListOf<Channel>()
                          for (i in 0 until arr.length()) {
                              val o = arr.getJSONObject(i)
                              out.add(
                                  Channel(
                                      o.getString("n"),
                                      o.getString("u"),
                                      o.optString("g", ""),
                                      o.optString("l", ""),
                                      o.optBoolean("f", false)
                                  )
                              )
                          }
                          out
                      } catch (e: Exception) {
                          defaultChannels.map { it.copy() }.toMutableList()
                      }
                  }
              }

              private fun save() {
                  val arr = JSONArray()
                  for (c in all) {
                      arr.put(
                          JSONObject()
                              .put("n", c.name)
                              .put("u", c.url)
                              .put("g", c.group)
                              .put("l", c.logo)
                              .put("f", c.fav)
                      )
                  }
                  prefs.edit().putString("channels_v3", arr.toString()).apply()
              }

              private fun playlists(): MutableList<String> {
                  val s = prefs.getString("playlists", "") ?: ""
                  return s.lines().filter { it.isNotBlank() }.toMutableList()
              }

              private fun savePlaylists(l: List<String>) {
                  prefs.edit().putString("playlists", l.joinToString("\n")).apply()
              }

              private fun refresh(rebuildChips: Boolean) {
                  val q = search.text.toString().trim().lowercase()
                  shown = all.filter { ch ->
                      val okFilter = when (filter) {
                          "" -> true
                          "★" -> ch.fav
                          else -> ch.group == filter
                      }
                      okFilter && (q.isEmpty() || ch.name.lowercase().contains(q))
                  }
                  adapter.notifyDataSetChanged()
                  countText.text = shown.size.toString() + " chaînes"
                  if (rebuildChips) rebuildChips()
              }

              private fun rebuildChips() {
                  chips.removeAllViews()
                  val groups = all.map { it.group }.filter { it.isNotBlank() }.distinct().sorted()
                  fun addChip(label: String, value: String) {
                      val c = pill(label, filter == value)
                      c.setOnClickListener {
                          filter = value
                          refresh(true)
                      }
                      val lp = LinearLayout.LayoutParams(-2, dp(36))
                      lp.setMargins(dp(4), 0, dp(4), 0)
                      chips.addView(c, lp)
                  }
                  addChip("Tous", "")
                  addChip("★ Favoris", "★")
                  for (g in groups) addChip(g, g)
              }

              // ---------- lecture ----------

              private fun play(ch: Channel) {
                  val exo = player ?: return
                  currentUrl = ch.url
                  prefs.edit().putString("last", ch.url).apply()
                  exo.setMediaItem(MediaItem.fromUri(ch.url))
                  exo.prepare()
                  exo.playWhenReady = true
                  showOverlay(ch.name)
                  adapter.notifyDataSetChanged()
              }

              private fun step(delta: Int) {
                  if (shown.isEmpty()) return
                  val idx = shown.indexOfFirst { it.url == currentUrl }
                  val next = if (idx < 0) 0 else (idx + delta + shown.size) % shown.size
                  play(shown[next])
                  list.smoothScrollToPosition(next)
              }

              private fun showOverlay(text: String) {
                  overlay.text = text
                  overlay.visibility = View.VISIBLE
                  ui.removeCallbacks(hideOverlay)
                  ui.postDelayed(hideOverlay, 3000)
              }

              private fun cycleResize() {
                  val modes = intArrayOf(
                      AspectRatioFrameLayout.RESIZE_MODE_FIT,
                      AspectRatioFrameLayout.RESIZE_MODE_FILL,
                      AspectRatioFrameLayout.RESIZE_MODE_ZOOM
                  )
                  val names = arrayOf("Ajusté", "Étiré", "Zoom")
                  resizeIndex = (resizeIndex + 1) % modes.size
                  playerView.setResizeMode(modes[resizeIndex])
                  showOverlay("Format : " + names[resizeIndex])
              }

              // ---------- affichage ----------

              private fun setChrome(visible: Boolean) {
                  val vis = if (visible) View.VISIBLE else View.GONE
                  header.visibility = vis
                  toolbarScroll.visibility = vis
                  chipsScroll.visibility = vis
                  search.visibility = vis
                  listFrame.visibility = vis
              }

              private fun applyPlayerSize() {
                  val lp = playerFrame.layoutParams as LinearLayout.LayoutParams
                  lp.width = -1
                  if (fullscreen || inPip) {
                      lp.height = -1
                  } else {
                      val m = resources.displayMetrics
                      lp.height = minOf(m.widthPixels * 9 / 16, m.heightPixels * 45 / 100)
                  }
                  playerFrame.layoutParams = lp
              }

              private fun setFullscreen(on: Boolean) {
                  fullscreen = on
                  setChrome(!on && !inPip)
                  requestedOrientation = if (on) ActivityInfo.SCREEN_ORIENTATION_SENSOR_LANDSCAPE
                  else ActivityInfo.SCREEN_ORIENTATION_UNSPECIFIED
                  window.decorView.systemUiVisibility = if (on) {
                      View.SYSTEM_UI_FLAG_FULLSCREEN or
                          View.SYSTEM_UI_FLAG_HIDE_NAVIGATION or
                          View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY or
                          View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN or
                          View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
                  } else {
                      View.SYSTEM_UI_FLAG_VISIBLE
                  }
                  applyPlayerSize()
              }

              override fun onConfigurationChanged(newConfig: Configuration) {
                  super.onConfigurationChanged(newConfig)
                  applyPlayerSize()
              }

              private fun enterPip() {
                  if (Build.VERSION.SDK_INT >= 26) {
                      try {
                          enterPictureInPictureMode(
                              PictureInPictureParams.Builder().setAspectRatio(Rational(16, 9)).build()
                          )
                      } catch (e: Exception) {
                          toast("PiP non disponible")
                      }
                  } else {
                      toast("PiP non disponible sur cet Android")
                  }
              }

              override fun onPictureInPictureModeChanged(isInPictureInPictureMode: Boolean, newConfig: Configuration) {
                  super.onPictureInPictureModeChanged(isInPictureInPictureMode, newConfig)
                  inPip = isInPictureInPictureMode
                  setChrome(!inPip && !fullscreen)
                  applyPlayerSize()
              }

              override fun onUserLeaveHint() {
                  super.onUserLeaveHint()
                  if (fullscreen && player?.isPlaying == true) enterPip()
              }

              override fun onBackPressed() {
                  if (fullscreen) setFullscreen(false) else super.onBackPressed()
              }

              override fun onKeyDown(keyCode: Int, event: KeyEvent?): Boolean {
                  when (keyCode) {
                      KeyEvent.KEYCODE_CHANNEL_UP, KeyEvent.KEYCODE_PAGE_UP, KeyEvent.KEYCODE_MEDIA_NEXT -> {
                          step(1)
                          return true
                      }
                      KeyEvent.KEYCODE_CHANNEL_DOWN, KeyEvent.KEYCODE_PAGE_DOWN, KeyEvent.KEYCODE_MEDIA_PREVIOUS -> {
                          step(-1)
                          return true
                      }
                  }
                  if (fullscreen) {
                      when (keyCode) {
                          KeyEvent.KEYCODE_DPAD_UP -> {
                              step(1)
                              return true
                          }
                          KeyEvent.KEYCODE_DPAD_DOWN -> {
                              step(-1)
                              return true
                          }
                          KeyEvent.KEYCODE_DPAD_CENTER, KeyEvent.KEYCODE_ENTER -> {
                              val p = player
                              if (p != null) {
                                  if (p.isPlaying) p.pause() else p.play()
                              }
                              return true
                          }
                      }
                  }
                  return super.onKeyDown(keyCode, event)
              }

              // ---------- dialogues ----------

              private fun sleepDialog() {
                  val labels = arrayOf("Désactivé", "15 minutes", "30 minutes", "60 minutes", "90 minutes", "120 minutes")
                  val mins = intArrayOf(0, 15, 30, 60, 90, 120)
                  dialog().setTitle("Minuteur de veille").setItems(labels) { _, i ->
                      ui.removeCallbacks(sleepRunnable)
                      if (mins[i] > 0) {
                          ui.postDelayed(sleepRunnable, mins[i] * 60000L)
                          toast("Arrêt dans " + mins[i] + " min")
                      } else {
                          toast("Minuteur désactivé")
                      }
                  }.show()
              }

              private fun menuDialog() {
                  val items = arrayOf(
                      "Ajouter une chaîne",
                      "Importer une playlist (lien)",
                      "Importer un fichier M3U",
                      "Actualiser mes playlists",
                      "Trier A → Z",
                      "Vider la liste",
                      "Réinitialiser (chaînes de test)",
                      "À propos"
                  )
                  dialog().setTitle("Plus d'options").setItems(items) { _, i ->
                      when (i) {
                          0 -> addChannelDialog()
                          1 -> m3uLinkDialog()
                          2 -> pickFile()
                          3 -> updatePlaylists()
                          4 -> {
                              all.sortBy { it.name.lowercase() }
                              save()
                              refresh(true)
                              toast("Liste triée")
                          }
                          5 -> confirm("Supprimer toutes les chaînes ?") {
                              all.clear()
                              save()
                              refresh(true)
                          }
                          6 -> confirm("Revenir aux chaînes de test ?") {
                              all = defaultChannels.map { it.copy() }.toMutableList()
                              savePlaylists(emptyList())
                              filter = ""
                              save()
                              refresh(true)
                          }
                          7 -> dialog().setTitle("TV Player 3.0")
                              .setMessage("Lecteur de chaînes TV (HLS, DASH).\n\nAppui long sur une chaîne pour plus d'options.")
                              .setPositiveButton("OK", null).show()
                      }
                  }.show()
              }

              private fun confirm(title: String, action: () -> Unit) {
                  dialog().setTitle(title)
                      .setPositiveButton("Oui") { _, _ -> action() }
                      .setNegativeButton("Annuler", null)
                      .show()
              }

              private fun channelMenu(ch: Channel) {
                  val items = arrayOf(
                      if (ch.fav) "Retirer des favoris" else "Ajouter aux favoris",
                      "Renommer",
                      "Copier le lien",
                      "Supprimer"
                  )
                  dialog().setTitle(ch.name).setItems(items) { _, i ->
                      when (i) {
                          0 -> {
                              ch.fav = !ch.fav
                              save()
                              refresh(true)
                          }
                          1 -> {
                              val n = field("Nom", ch.name)
                              dialog().setTitle("Renommer").setView(form(n))
                                  .setPositiveButton("OK") { _, _ ->
                                      val t = n.text.toString().trim()
                                      if (t.isNotEmpty()) {
                                          ch.name = t
                                          save()
                                          refresh(false)
                                      }
                                  }
                                  .setNegativeButton("Annuler", null).show()
                          }
                          2 -> {
                              val cm = getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager
                              cm.setPrimaryClip(ClipData.newPlainText("lien", ch.url))
                              toast("Lien copié")
                          }
                          3 -> confirm("Supprimer cette chaîne ?") {
                              all.remove(ch)
                              save()
                              refresh(true)
                          }
                      }
                  }.show()
              }

              private fun addChannelDialog() {
                  val n = field("Nom de la chaîne")
                  val u = field("Lien du flux (.m3u8)")
                  val g = field("Groupe (facultatif)")
                  dialog().setTitle("Ajouter une chaîne").setView(form(n, u, g))
                      .setPositiveButton("Ajouter") { _, _ ->
                          val url = u.text.toString().trim()
                          val name = n.text.toString().trim()
                          if (url.isNotEmpty()) {
                              all.add(Channel(if (name.isEmpty()) url else name, url, g.text.toString().trim()))
                              save()
                              refresh(true)
                          }
                      }
                      .setNegativeButton("Annuler", null).show()
              }

              // ---------- playlists ----------

              private fun m3uLinkDialog() {
                  val u = field("Lien de la playlist (.m3u)")
                  dialog().setTitle("Importer une playlist").setView(form(u))
                      .setPositiveButton("Importer") { _, _ ->
                          val url = u.text.toString().trim()
                          if (url.isNotEmpty()) {
                              val l = playlists()
                              if (!l.contains(url)) {
                                  l.add(url)
                                  savePlaylists(l)
                              }
                              fetchPlaylist(url)
                          }
                      }
                      .setNegativeButton("Annuler", null).show()
              }

              private fun updatePlaylists() {
                  val l = playlists()
                  if (l.isEmpty()) {
                      toast("Aucune playlist enregistrée")
                      return
                  }
                  for (url in l) fetchPlaylist(url)
              }

              private fun fetchPlaylist(link: String) {
                  toast("Chargement…")
                  pool.execute {
                      try {
                          val c = URL(link).openConnection() as HttpURLConnection
                          c.connectTimeout = 15000
                          c.readTimeout = 30000
                          c.instanceFollowRedirects = true
                          c.setRequestProperty("User-Agent", "Mozilla/5.0")
                          val text = c.inputStream.bufferedReader().use { it.readText() }
                          val found = parseM3u(text)
                          runOnUiThread { mergeChannels(found) }
                      } catch (e: Exception) {
                          runOnUiThread { toast("Erreur : " + e.message) }
                      }
                  }
              }

              private fun mergeChannels(found: List<Channel>) {
                  val known = all.map { it.url }.toHashSet()
                  val fresh = found.filter { known.add(it.url) }
                  all.addAll(fresh)
                  save()
                  refresh(true)
                  toast(fresh.size.toString() + " nouvelles chaînes")
              }

              private fun pickFile() {
                  val i = Intent(Intent.ACTION_OPEN_DOCUMENT)
                  i.addCategory(Intent.CATEGORY_OPENABLE)
                  i.type = "*/*"
                  startActivityForResult(i, 11)
              }

              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  super.onActivityResult(requestCode, resultCode, data)
                  if (requestCode == 11 && resultCode == RESULT_OK) {
                      val uri = data?.data ?: return
                      pool.execute {
                          try {
                              val stream = contentResolver.openInputStream(uri)
                              val text = stream!!.bufferedReader().use { it.readText() }
                              val found = parseM3u(text)
                              runOnUiThread { mergeChannels(found) }
                          } catch (e: Exception) {
                              runOnUiThread { toast("Erreur : " + e.message) }
                          }
                      }
                  }
              }

              // ---------- cycle de vie ----------

              override fun onStop() {
                  if (!inPip) player?.pause()
                  super.onStop()
              }

              override fun onDestroy() {
                  ui.removeCallbacksAndMessages(null)
                  player?.release()
                  player = null
                  pool.shutdownNow()
                  super.onDestroy()
              }
          }
          EOF

      - name: Build APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tvplayer-apk
          path: app/build/outputs/apk/debug/*.apk
