              private fun updateRecBadge() {
                  if (recorder.active) {
                      val mb = String.format(Locale.US, "%.0f MB", recorder.bytes / 1048576.0)
                      recBadge.text = "● REC " + fmtDur(System.currentTimeMillis() - recorder.startMs) + "   " + mb
