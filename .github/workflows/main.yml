              private fun recordingsDialog() {
                  val files = (recDir().listFiles() ?: emptyArray<File>())
                      .filter { it.isFile && it.name.endsWith(".ts") }
                      .sortedByDescending { it.lastModified() }
                  val sched = loadSched()
