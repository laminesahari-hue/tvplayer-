          data class Channel(
              var name: String,
              val url: String,
              var group: String = "",
              var logo: String = "",
              var fav: Boolean = false,
              var tvgId: String = "",
              var src: String = ""
          )

          data class Vod(
              val id: String,
              var name: String,
              val poster: String,
              val group: String,
              val kind: Int,
              val ext: String,
              val src: String,
              val rating: String = ""
          )

          data class Episode(
              val id: String,
              val title: String,
              val season: Int,
              val num: Int,
              val ext: String,
              val plot: String
          )

          data class Playlist(val channels: List<Channel>, val epgUrl: String)

          data class Account(val name: String, val server: String, val user: String, val pass: String) {
              fun key(): String = "xt:" + server + "|" + user
              fun label(): String =
                  if (name.isBlank()) user + "@" + server.substringAfter("://") else name
          }

          val defaultChannels = listOf(
              Channel("Test - Big Buck Bunny", "https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8", "Test"),
              Channel("Test - Apple BipBop", "https://devstreaming-cdn.apple.com/videos/streaming/examples/img_bipbop_adv_example_fmp4/master.m3u8", "Test")
          )

          private val attrRegex = Regex("([a-zA-Z0-9_-]+)=\"([^\"]*)\"")

          fun parseM3u(text: String): Playlist {
              val out = ArrayList<Channel>()
              var epg = ""
              var name = ""
              var group = ""
              var logo = ""
              var tvgId = ""
              for (raw in text.lines()) {
                  val line = raw.trim()
                  if (line.startsWith("#EXTM3U")) {
                      for (m in attrRegex.findAll(line)) {
                          val k = m.groupValues[1].lowercase()
                          if (k == "url-tvg" || k == "x-tvg-url" || k == "tvg-url") {
                              epg = m.groupValues[2].substringBefore(",").trim()
                          }
                      }
                  } else if (line.startsWith("#EXTINF")) {
                      name = line.substringAfterLast(",", "").trim()
                      group = ""
                      logo = ""
                      tvgId = ""
                      var tvgName = ""
                      for (m in attrRegex.findAll(line)) {
                          when (m.groupValues[1].lowercase()) {
                              "group-title" -> group = m.groupValues[2].trim()
                              "tvg-logo" -> logo = m.groupValues[2].trim()
                              "tvg-id" -> tvgId = m.groupValues[2].trim()
                              "tvg-name" -> tvgName = m.groupValues[2].trim()
                          }
                      }
                      if (name.isEmpty()) name = tvgName
                  } else if (line.startsWith("#EXTGRP:")) {
                      if (group.isEmpty()) group = line.substringAfter(":").trim()
                  } else if (line.isNotEmpty() && !line.startsWith("#")) {
                      val url = line.substringBefore("|").trim()
                      out.add(Channel(if (name.isEmpty()) url else name, url, group, logo, false, tvgId))
                      name = ""
                      group = ""
                      logo = ""
                      tvgId = ""
                  }
              }
              return Playlist(out, epg)
          }
          EOF

          cat > app/src/main/java/com/example/tvplayer/Epg.kt << 'EOF'
          package com.example.tvplayer

          import android.util.Xml
          import java.io.BufferedInputStream
          import java.io.InputStream
          import java.text.SimpleDateFormat
          import java.util.Locale
          import java.util.TimeZone
          import java.util.zip.GZIPInputStream
          import org.xmlpull.v1.XmlPullParser

          data class Programme(val start: Long, val stop: Long, val title: String, val desc: String = "")

          object Epg {
              @Volatile
              var data: Map<String, List<Programme>> = emptyMap()

              fun now(id: String): Programme? {
                  if (id.isBlank()) return null
                  val l = data[id.lowercase()] ?: return null
                  val t = System.currentTimeMillis()
                  return l.firstOrNull { it.start <= t && t < it.stop }
              }

              fun next(id: String): Programme? {
                  if (id.isBlank()) return null
                  val l = data[id.lowercase()] ?: return null
                  val t = System.currentTimeMillis()
                  val cur = l.firstOrNull { it.start <= t && t < it.stop }
                  val from = if (cur != null) cur.stop else t
                  return l.firstOrNull { it.start >= from }
              }

              fun list(id: String): List<Programme> {
                  if (id.isBlank()) return emptyList()
                  val l = data[id.lowercase()] ?: return emptyList()
                  val t = System.currentTimeMillis()
                  return l.filter { it.stop > t }
              }

              private fun parseTime(s: String?, f1: SimpleDateFormat, f2: SimpleDateFormat): Long {
                  if (s == null) return 0L
                  val t = s.trim()
                  return try {
                      if (t.length > 14) {
                          val fixed = t.substring(0, 14) + " " + t.substring(14).trim()
                          val d = f1.parse(fixed)
                          if (d != null) d.time else 0L
                      } else {
                          val d = f2.parse(t)
                          if (d != null) d.time else 0L
                      }
                  } catch (e: Exception) {
                      0L
                  }
              }

              fun parse(raw: InputStream, wanted: Set<String>): Map<String, List<Programme>> {
                  val buf = BufferedInputStream(raw, 65536)
                  buf.mark(2)
                  val b1 = buf.read()
                  val b2 = buf.read()
                  buf.reset()
                  val stream: InputStream = if (b1 == 0x1f && b2 == 0x8b) GZIPInputStream(buf, 65536) else buf

                  val parser = Xml.newPullParser()
                  parser.setInput(stream, null)

                  val f1 = SimpleDateFormat("yyyyMMddHHmmss Z", Locale.US)
                  val f2 = SimpleDateFormat("yyyyMMddHHmmss", Locale.US)
                  f2.timeZone = TimeZone.getTimeZone("UTC")

                  val out = HashMap<String, MutableList<Programme>>()
                  val now = System.currentTimeMillis()
                  val minT = now - 4 * 3600000L
                  val maxT = now + 30 * 3600000L

                  var inProg = false
                  var ch = ""
                  var start = 0L
                  var stop = 0L
                  var title = ""
                  var desc = ""

                  var ev = parser.eventType
                  while (ev != XmlPullParser.END_DOCUMENT) {
                      if (ev == XmlPullParser.START_TAG) {
                          val n = parser.name
                          if (n == "programme") {
                              inProg = true
                              ch = (parser.getAttributeValue(null, "channel") ?: "").lowercase()
                              start = parseTime(parser.getAttributeValue(null, "start"), f1, f2)
                              stop = parseTime(parser.getAttributeValue(null, "stop"), f1, f2)
                              title = ""
                              desc = ""
                          } else if (n == "title" && inProg && title.isEmpty()) {
                              title = parser.nextText().trim()
                          } else if (n == "desc" && inProg && desc.isEmpty()) {
                              desc = parser.nextText().trim().take(300)
                          }
                      } else if (ev == XmlPullParser.END_TAG) {
                          if (parser.name == "programme") {
                              if (inProg && wanted.contains(ch) && stop > minT && start < maxT) {
                                  out.getOrPut(ch) { mutableListOf() }.add(Programme(start, stop, title, desc))
                              }
                              inProg = false
                          }
                      }
                      ev = parser.next()
                  }
                  for (l in out.values) l.sortBy { it.start }
                  return out
              }
          }
          EOF

