                      labels.add("● " + tr("Arrêter : ", "Stop: ", "إيقاف: ", "Detener: ") + recorder.title)
                      acts.add { toggleRecord() }
                  }
                  for (s in sched) {
                      labels.add("⏰ " + dayFmt.format(Date(s.start)) + "  " + s.name + "  (" + s.min + " min)")
                      acts.add {
