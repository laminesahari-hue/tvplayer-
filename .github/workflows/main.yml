              private fun channelsFile(): File = File(filesDir, "channels_v5.json")

              private fun vodFile(): File = File(filesDir, "vod_v6.json")

              private fun load() {
                  var out: MutableList<Channel>? = null
                  try {
                      val f = channelsFile()
                      if (f.exists()) {
                          val arr = JSONArray(f.readText())
                          val list = ArrayList<Channel>(arr.length())
                          for (i in 0 until arr.length()) {
                              val o = arr.getJSONObject(i)
                              list.add(
                                  Channel(
                                      o.getString("n"),
                                      o.getString("u"),
                                      o.optString("g", ""),
                                      o.optString("l", ""),
                                      o.optBoolean("f", false),
                                      o.optString("i", ""),
                                      o.optString("s", "")
                                  )
                              )
                          }
                          out = list
                      }
                  } catch (e: Exception) {
                      out = null
                  }
                  val base = out ?: defaultChannels.map { it.copy() }.toMutableList()
                  all = base.distinctBy { it.url }.toMutableList()
              }

              private fun save() {
                  try {
                      val arr = JSONArray()
                      for (c in all) {
                          arr.put(
                              JSONObject()
                                  .put("n", c.name)
                                  .put("u", c.url)
                                  .put("g", c.group)
                                  .put("l", c.logo)
                                  .put("f", c.fav)
                                  .put("i", c.tvgId)
                                  .put("s", c.src)
                          )
                      }
                      channelsFile().writeText(arr.toString())
                  } catch (e: Exception) {
                  }
              }

              private fun loadVodFile(): MutableList<Vod> {
                  val out = ArrayList<Vod>()
                  try {
                      val f = vodFile()
                      if (f.exists()) {
                          val arr = JSONArray(f.readText())
                          for (i in 0 until arr.length()) {
                              val o = arr.getJSONObject(i)
                              out.add(
                                  Vod(
                                      o.getString("i"),
                                      o.getString("n"),
                                      o.optString("p", ""),
                                      o.optString("g", ""),
                                      o.optInt("k", 1),
                                      o.optString("e", "mp4"),
                                      o.optString("s", ""),
                                      o.optString("r", "")
                                  )
                              )
                          }
                      }
                  } catch (e: Throwable) {
                  }
                  return out
              }

              private fun saveVodFile(list: List<Vod>) {
                  try {
                      val arr = JSONArray()
                      for (v in list) {
                          arr.put(
                              JSONObject()
                                  .put("i", v.id)
                                  .put("n", v.name)
                                  .put("p", v.poster)
                                  .put("g", v.group)
                                  .put("k", v.kind)
                                  .put("e", v.ext)
                                  .put("s", v.src)
                                  .put("r", v.rating)
                          )
                      }
                      vodFile().writeText(arr.toString())
                  } catch (e: Throwable) {
                  }
              }

              @Synchronized
              private fun vodLoadOnce() {
                  if (!vodLoaded) {
                      vods = loadVodFile()
                      vodLoaded = true
                  }
              }

              private fun ensureVod() {
                  if (vodLoaded) return
                  pool.execute {
                      vodLoadOnce()
                      runOnUiThread {
                          if (section != 0) refresh(true)
                      }
                  }
              }

