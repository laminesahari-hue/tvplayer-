<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TV Player</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0e1117;color:#e8ebf0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.wrap{max-width:720px;margin:0 auto;padding:16px}
h1{font-size:24px;margin:8px 0 16px}
h3{margin:0 0 10px;font-size:16px;color:#9ab8ff}
.card{background:#181c25;border-radius:14px;padding:14px;margin-bottom:12px}
input,select,textarea{width:100%;padding:12px;margin:5px 0;border-radius:10px;border:1px solid #2b3342;background:#0e1117;color:#fff;font-size:15px}
button{width:100%;padding:12px;margin-top:6px;border:0;border-radius:10px;background:#4f8cff;color:#fff;font-size:15px;font-weight:600}
button.alt{background:#2b3342}
.msg{background:#16341f;color:#9ff0b4;border-radius:12px;padding:12px;margin-bottom:12px}
.err{color:#ffb4b4;margin-top:6px}
.st div{padding:3px 0;color:#c8cfdb}
</style>
</head>
<body>
<div class="wrap">
<h1>TV Player</h1>
<div id="login" class="card" style="display:none">
<h3 id="tLogin"></h3>
<input id="pin" type="number" inputmode="numeric" autocomplete="off">
<button id="bLogin">OK</button>
<div id="err" class="err"></div>
</div>
<div id="app" style="display:none">
<div id="msg" class="msg" style="display:none"></div>
<div class="card st"><h3 id="tStatus"></h3><div id="status"></div></div>
<div id="forms"></div>
</div>
</div>
<script>
var D = {
fr: {login:"Code d'acces (affiche sur la TV)",wrong:"Code incorrect",status:"Etat",
refresh:"Actualisation",refreshB:"Tout actualiser (sources, films, guide)",
play:"Lire une chaine",playP:"Numero ou nom",playB:"Lire sur la TV",
addCh:"Ajouter une chaine",name:"Nom",url:"Lien du flux (.m3u8 / .ts)",group:"Groupe (facultatif)",add:"Ajouter",
m3u:"Playlist M3U (lien)",imp:"Importer",
m3uText:"Playlist M3U (texte colle)",
xt:"Xtream",xtName:"Nom (facultatif)",xtUser:"Identifiant",xtPass:"Mot de passe",xtB:"Se connecter",
epg:"Guide TV (EPG)",epgP:"ou lien XMLTV personnalise",epgB:"Enregistrer et charger",
rec:"Enregistrement (PVR)",recB:"Enregistrer la chaine en cours",recStop:"Arreter l'enregistrement",
sched:"Planifier un enregistrement",schedQ:"Chaine (numero ou nom)",schedMin:"Duree (minutes)",schedB:"Planifier"},
en: {login:"Access code (shown on the TV)",wrong:"Wrong code",status:"Status",
refresh:"Refresh",refreshB:"Refresh all (sources, movies, guide)",
play:"Play a channel",playP:"Number or name",playB:"Play on the TV",
addCh:"Add a channel",name:"Name",url:"Stream link (.m3u8 / .ts)",group:"Group (optional)",add:"Add",
m3u:"M3U playlist (link)",imp:"Import",
m3uText:"M3U playlist (pasted text)",
xt:"Xtream",xtName:"Name (optional)",xtUser:"Username",xtPass:"Password",xtB:"Connect",
epg:"TV guide (EPG)",epgP:"or custom XMLTV link",epgB:"Save and load",
rec:"Recording (PVR)",recB:"Record the current channel",recStop:"Stop recording",
sched:"Schedule a recording",schedQ:"Channel (number or name)",schedMin:"Duration (minutes)",schedB:"Schedule"},
es: {login:"Codigo de acceso (visible en la TV)",wrong:"Codigo incorrecto",status:"Estado",
refresh:"Actualizar",refreshB:"Actualizar todo (fuentes, peliculas, guia)",
play:"Reproducir un canal",playP:"Numero o nombre",playB:"Reproducir en la TV",
addCh:"Anadir un canal",name:"Nombre",url:"Enlace del flujo (.m3u8 / .ts)",group:"Grupo (opcional)",add:"Anadir",
m3u:"Lista M3U (enlace)",imp:"Importar",
m3uText:"Lista M3U (texto)",
xt:"Xtream",xtName:"Nombre (opcional)",xtUser:"Usuario",xtPass:"Contrasena",xtB:"Conectar",
epg:"Guia TV (EPG)",epgP:"o enlace XMLTV",epgB:"Guardar y cargar",
rec:"Grabacion (PVR)",recB:"Grabar el canal actual",recStop:"Detener grabacion",
sched:"Programar grabacion",schedQ:"Canal (numero o nombre)",schedMin:"Duracion (minutos)",schedB:"Programar"},
ar: {login:"\u0631\u0645\u0632 \u0627\u0644\u062f\u062e\u0648\u0644 (\u064a\u0638\u0647\u0631 \u0639\u0644\u0649 \u0627\u0644\u062a\u0644\u0641\u0627\u0632)",wrong:"\u0631\u0645\u0632 \u062e\u0627\u0637\u0626",status:"\u0627\u0644\u062d\u0627\u0644\u0629",
refresh:"\u062a\u062d\u062f\u064a\u062b",refreshB:"\u062a\u062d\u062f\u064a\u062b \u0627\u0644\u0643\u0644",
play:"\u062a\u0634\u063a\u064a\u0644 \u0642\u0646\u0627\u0629",playP:"\u0627\u0644\u0631\u0642\u0645 \u0623\u0648 \u0627\u0644\u0627\u0633\u0645",playB:"\u062a\u0634\u063a\u064a\u0644 \u0639\u0644\u0649 \u0627\u0644\u062a\u0644\u0641\u0627\u0632",
addCh:"\u0625\u0636\u0627\u0641\u0629 \u0642\u0646\u0627\u0629",name:"\u0627\u0644\u0627\u0633\u0645",url:"\u0631\u0627\u0628\u0637 \u0627\u0644\u0628\u062b (.m3u8 / .ts)",group:"\u0627\u0644\u0645\u062c\u0645\u0648\u0639\u0629 (\u0627\u062e\u062a\u064a\u0627\u0631\u064a)",add:"\u0625\u0636\u0627\u0641\u0629",
m3u:"\u0642\u0627\u0626\u0645\u0629 M3U (\u0631\u0627\u0628\u0637)",imp:"\u0627\u0633\u062a\u064a\u0631\u0627\u062f",
m3uText:"\u0642\u0627\u0626\u0645\u0629 M3U (\u0646\u0635)",
xt:"Xtream",xtName:"\u0627\u0644\u0627\u0633\u0645 (\u0627\u062e\u062a\u064a\u0627\u0631\u064a)",xtUser:"\u0627\u0633\u0645 \u0627\u0644\u0645\u0633\u062a\u062e\u062f\u0645",xtPass:"\u0643\u0644\u0645\u0629 \u0627\u0644\u0645\u0631\u0648\u0631",xtB:"\u0627\u062a\u0635\u0627\u0644",
epg:"\u062f\u0644\u064a\u0644 \u0627\u0644\u0628\u0631\u0627\u0645\u062c (EPG)",epgP:"\u0623\u0648 \u0631\u0627\u0628\u0637 XMLTV",epgB:"\u062d\u0641\u0638 \u0648\u062a\u062d\u0645\u064a\u0644",
rec:"\u0627\u0644\u062a\u0633\u062c\u064a\u0644 (PVR)",recB:"\u062a\u0633\u062c\u064a\u0644 \u0627\u0644\u0642\u0646\u0627\u0629 \u0627\u0644\u062d\u0627\u0644\u064a\u0629",recStop:"\u0625\u064a\u0642\u0627\u0641 \u0627\u0644\u062a\u0633\u062c\u064a\u0644",
sched:"\u062c\u062f\u0648\u0644\u0629 \u062a\u0633\u062c\u064a\u0644",schedQ:"\u0627\u0644\u0642\u0646\u0627\u0629 (\u0631\u0642\u0645 \u0623\u0648 \u0627\u0633\u0645)",schedMin:"\u0627\u0644\u0645\u062f\u0629 (\u062f\u0642\u0627\u0626\u0642)",schedB:"\u062c\u062f\u0648\u0644\u0629"}
};
var L = (navigator.language || "en").slice(0, 2);
if (!D[L]) { L = "en"; }
var T = D[L];
if (L === "ar") { document.documentElement.dir = "rtl"; }
var pin = new URLSearchParams(location.search).get("pin") || sessionStorage.getItem("pin") || "";
var presets = [];

function g(id) { return document.getElementById(id); }
function enc(o) {
  var a = [];
  for (var k in o) { a.push(encodeURIComponent(k) + "=" + encodeURIComponent(o[k])); }
  return a.join("&");
}
function call(method, url, body, cb) {
  var x = new XMLHttpRequest();
  x.open(method, url);
  x.setRequestHeader("Content-Type", "application/x-www-form-urlencoded");
  x.onload = function () { cb(x.status, x.responseText); };
  x.onerror = function () { cb(0, ""); };
  x.send(body || null);
}
function showMsg(t) {
  var m = g("msg");
  m.textContent = t;
  m.style.display = "block";
  window.scrollTo(0, 0);
}
function loadStatus() {
  call("GET", "/api/status?pin=" + encodeURIComponent(pin), null, function (s, t) {
    if (s === 200) {
      g("status").innerHTML = "";
      t.split("\n").forEach(function (l) {
        if (l) { var d = document.createElement("div"); d.textContent = l; g("status").appendChild(d); }
      });
    }
  });
}
var FORMS = [
  {a: "refresh", t: "refresh", f: [], b: "refreshB"},
  {a: "play", t: "play", f: [["q", "text", "playP"]], b: "playB"},
  {a: "add_channel", t: "addCh", f: [["name", "text", "name"], ["url", "url", "url"], ["group", "text", "group"]], b: "add"},
  {a: "add_m3u", t: "m3u", f: [["url", "url", "url"]], b: "imp"},
  {a: "add_m3u_text", t: "m3uText", f: [["text", "area", "m3uText"]], b: "imp"},
  {a: "add_xtream", t: "xt", f: [["name", "text", "xtName"], ["server", "url", ""], ["user", "text", "xtUser"], ["pass", "password", "xtPass"]], b: "xtB"},
  {a: "set_epg", t: "epg", f: [["preset", "select", ""], ["url", "url", "epgP"]], b: "epgB"},
  {a: "rec_start", t: "rec", f: [], b: "recB"},
  {a: "rec_stop", t: "recStop", f: [], b: "recStop", alt: true},
  {a: "rec_schedule", t: "sched", f: [["q", "text", "schedQ"], ["time", "time", ""], ["min", "number", "schedMin"]], b: "schedB"}
];
function buildForms() {
  var box = g("forms");
  box.innerHTML = "";
  FORMS.forEach(function (F) {
    var card = document.createElement("div");
    card.className = "card";
    var h = document.createElement("h3");
    h.textContent = T[F.t];
    card.appendChild(h);
    var fields = {};
    F.f.forEach(function (f) {
      var el;
      if (f[1] === "area") {
        el = document.createElement("textarea");
        el.rows = 6;
        el.placeholder = "#EXTM3U";
      } else if (f[1] === "select") {
        el = document.createElement("select");
        var o0 = document.createElement("option");
        o0.value = "";
        o0.textContent = "-";
        el.appendChild(o0);
        presets.forEach(function (p) {
          var o = document.createElement("option");
          o.value = p[1];
          o.textContent = p[0];
          el.appendChild(o);
        });
      } else {
        el = document.createElement("input");
        el.type = f[1];
        el.placeholder = f[2] ? T[f[2]] : (f[0] === "server" ? "http://host:port" : (f[0] === "time" ? "HH:mm" : ""));
        if (f[0] === "min") { el.value = "60"; }
        el.setAttribute("autocomplete", "off");
      }
      fields[f[0]] = el;
      card.appendChild(el);
    });
    var b = document.createElement("button");
    b.textContent = T[F.b];
    if (F.alt) { b.className = "alt"; }
    b.onclick = function () {
      var data = {pin: pin};
      for (var k in fields) { data[k] = fields[k].value; }
      b.disabled = true;
      call("POST", "/api/do/" + F.a, enc(data), function (s, t) {
        b.disabled = false;
        showMsg(s === 200 ? t : "Error " + s);
        loadStatus();
      });
    };
    card.appendChild(b);
    box.appendChild(card);
  });
}
function start() {
  g("login").style.display = "none";
  g("app").style.display = "block";
  g("tStatus").textContent = T.status;
  call("GET", "/api/presets?pin=" + encodeURIComponent(pin), null, function (s, t) {
    presets = [];
    if (s === 200) {
      t.split("\n").forEach(function (l) {
        var i = l.indexOf("|");
        if (i > 0) { presets.push([l.substring(0, i), l.substring(i + 1)]); }
      });
    }
    buildForms();
  });
  loadStatus();
}
function tryLogin(showError) {
  call("GET", "/api/status?pin=" + encodeURIComponent(pin), null, function (s, t) {
    if (s === 200) {
      sessionStorage.setItem("pin", pin);
      start();
    } else {
      g("login").style.display = "block";
      g("tLogin").textContent = T.login;
      g("err").textContent = showError ? T.wrong : "";
    }
  });
}
g("bLogin").onclick = function () { pin = g("pin").value; tryLogin(true); };
tryLogin(false);
</script>
</body>
</html>
