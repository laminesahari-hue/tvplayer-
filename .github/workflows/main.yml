      - name: Build APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tvplayer-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk TVPlayer.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: latest
          name: TV Player (latest)
          files: TVPlayer.apk
